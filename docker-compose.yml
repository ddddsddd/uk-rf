# Запуск: docker compose up -d --build — игра на http://IP-сервера.
# Другой порт сохраните в файле .env рядом с этим файлом (его читает и обновление):
#   echo PUBLIC_PORT=8080 | sudo tee .env
services:
  uk-rps:
    build: .
    image: uk-rps
    container_name: uk-rps
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-80}:3000"
